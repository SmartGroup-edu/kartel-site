name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Snapshot tests
        run: npm test

  registry-sync:
    # Bus 169 B4: the vendored registry and federation snapshot must equal kartel-core main.
    # kartel-core is private; the kartel-sync-bot App token (read on kartel-core only) checks it out.
    # This repo is public, so the job prints only versions, dates and key names of public files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.KARTEL_SYNC_APP_ID }}
          private-key: ${{ secrets.KARTEL_SYNC_APP_KEY }}
          owner: SmartGroup-edu
          repositories: kartel-core

      - uses: actions/checkout@v4
        with:
          repository: SmartGroup-edu/kartel-core
          ref: main
          token: ${{ steps.app.outputs.token }}
          path: .kartel-core
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Vendored copy equals kartel-core
        env:
          KARTEL_CORE_DIR: .kartel-core
        run: npm run registry:check

  e2e:
    # QA-156 M8: the repo e2e against a real `next start` (production cookie names), plus H1 «Завершить сеансы»
    # end to end with the real Family OS app in the test process. Synthetic addresses and test-only secrets.
    runs-on: ubuntu-latest
    env:
      FAMILY_GATE: "on"
      FAMILY_SESSION_SECRET: e2e-secret-at-least-32-characters-long!!
      FAMILY_APPROVED_EMAILS: member@example.com
      FAMILY_ADMIN_EMAILS: admin@example.com
      FAMILY_MAIL_RELAY_URL: http://127.0.0.1:18797 # bus 165: the code e2e runs a fake relay here; elsewhere nothing listens
      FAMILY_MAIL_RELAY_SECRET: fake-relay-secret-ci-e2e-only-0000000000
      FAMILY_SITE_ORIGIN: http://localhost:3999
      FAMILY_OS_URL: http://127.0.0.1:18795
      FAMILY_OS_SECRET: e2e-os-secret-at-least-32-characters!!
      FAMILY_MEDIA_URL: http://127.0.0.1:9
      FAMILY_MEDIA_SECRET: e2e-media-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci && npm ci --prefix family-os

      - name: Build
        run: npm run build

      - name: E2E
        run: |
          npx next start -p 3999 > /tmp/site.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3999/en && break; sleep 1; done
          node tests/e2e/family-auth.e2e.mjs
          node tests/e2e/family-ended.e2e.mjs
          node tests/e2e/family-os-calls.e2e.mjs
          node tests/e2e/family-signin-code.e2e.mjs

  family-os-postgres:
    # schema.sql re-applied to a populated database, then a runner tick (QA-156 C1).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine3.22
        env:
          POSTGRES_USER: kfo
          POSTGRES_PASSWORD: kfo-ci-only
          POSTGRES_DB: kfo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kfo -d kfo" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci && npm ci --prefix family-os

      - name: Postgres tests
        env:
          FAMILY_OS_TEST_DATABASE_URL: postgres://kfo:kfo-ci-only@localhost:5432/kfo
        run: npm run test:pg
